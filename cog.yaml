build:
  gpu: true
  cuda: "12.1"
  python_version: "3.11"
  system_packages:
    - "ffmpeg"
    - "git"
    - "wget"
    - "curl"
  python_packages:
    - "comfy-aimdo"
    - "comfy-kitchen"
    - "av"
    - "soundfile"
    - "websocket-client"
    - "requests"
  run:
    - "pip install --no-cache-dir torch torchaudio --index-url https://download.pytorch.org/whl/cu121"
    - "git clone https://github.com/comfyanonymous/ComfyUI.git /root/ComfyUI"
    - "pip install --no-cache-dir -r /root/ComfyUI/requirements.txt"
    - "mkdir -p /root/ComfyUI/models/checkpoints"
    - "wget -c https://huggingface.co/Comfy-Org/YuE2/resolve/main/checkpoints/yue2_3b_int8_convrot.safetensors -O /root/ComfyUI/models/checkpoints/yue2_3b_int8_convrot.safetensors"

predict: "predict.py:Predictor"